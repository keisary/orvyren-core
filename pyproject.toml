# Tooling configuration only.
#
# NO [build-system] and no [project]: the repo is not an installable package.
# Imports go through `PYTHONPATH=src` (Makefile, Dockerfile, CI, and every test
# module inserts src/ itself).

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# The v1 baseline is frozen (FREEZE_V2): no mass reformatting is allowed. The
# blocking gate is therefore limited to fatal errors — syntax, invalid imports,
# undefined names — that would actually break execution.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
