# ORVYREN — politique v1 — PARAMÈTRES
# Source de vérité des PARAMÈTRES ; la sémantique des règles vit dans le code
# (src/orvyren/policy/__init__.py) — DOC2 §5.5.3. Toute modification suit la
# procédure de changement à 6 étapes (docs/decisions/ADR-0002).
# Aucune adresse de session ici : les destinataires sont des LABELS résolus
# au montage (cf. scripts/demo/.env — jamais versionné).

schema: orvyren-policy/v1
policy_version: v1.0

# --- chaîne et actif (démo : Base Sepolia, USDC de test Circle) ---
