allowance_period_seconds: 86400
role_key: "0x4147454e54000000000000000000000000000000000000000000000000000000"
revocation_scheduled_at: "2026-11-15T23:59:59Z"

# --- registre des fonctions (P4) : seule opération exécutable en v1 ---
functions:
  - operation: transfer
    target: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
    selector: "0xa9059cbb"

# --- budget de décision (P14) : plafond par décision, en USD ---
decision_budget_usd: "0.10"

# --- fixture de conformité (test de dérive, L4.4) ---
envelope_fixture: "fixtures/roles_agent_config.json"
