name: tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Safety bench and unit tests
        run: python -m unittest discover -s tests -v
      - name: ADR registry index check (W8)
        run: python scripts/adr_index.py --check
      - name: Full pipeline end-to-end (quality -> decision -> policy -> audit)
        run: python run_pipeline.py
      - name: Corpus presence check (replay mode must work offline)
        run: python collect_corpus.py --offline
