# ORVYREN-Core — bounded action catalogue v1 (W3 lot L3.5): source of truth
# for the PARAMETERS. 8 DAO actions + 4 desk actions (B3 §d.2-d.4, DOC2 §5.4.5).
#
# Action template: epistemic trigger, economic threshold, bounds, cost,
# expected effect, applicability — plus the measured precedent that justifies it. An
# action is never a free-form order: it is a bounded intent that the policy
# may refuse (P13). No action opens new exposure under stress.
#
# Applicability is an ENUM enforced by the code (catalog.APPLICABILITY_*):
#   on-chain / simulated / escalate (not an agent action) / default (baseline state).
#   Those four literals are contract values (code constants) and stay word-for-word as-is.
#
# The catalogue is versioned and execution cites its version (INV-AUTH). Loaded by
# src/orvyren/decision/catalog.py with the strict stdlib mini-YAML of W4
# (orvyren.policy.miniyaml) — any template violation raises (fail-closed).

schema: "orvyren-actions-catalog/v1"
catalog_version: "catalog/v1"

# ---------------------------------------------------------------------------
# DAO catalogue — 8 actions.
# ---------------------------------------------------------------------------
persona_dao:
  - action_id: "A-D1"
    persona: "DAO"
    name: "Pre-position / convert"
    epistemic_trigger: "H2 SUPPORTED (broad stress) or H1 SUPPORTED without containment certainty, A1-A3 lifted"
    economic_trigger: "E[loss avoided] = P(obligation)·(L(A0)-L(a)) > cost ; otherwise NO-ACTION"
    bounds: "x <= x_max ; venue on the allowlist ; <= Depth_eps depth"
    cost: "fees + measured slippage (get_dy) + gas"
    expected_effect: "reduces conditional exposure ; pays a premium otherwise (round trip ~ -4.0% measured, W2-D §E.2b)"
    applicability: "on-chain"
    precedent: "Maker 11-13/03/2023 (PSM) ; Eco (>= 2 issuers) ; ENS IPS"

  - action_id: "A-D2"
    persona: "DAO"
    name: "Exit an LST"
    epistemic_trigger: "realizable discount > threshold (>= 100/300/600 bps) AND not transient (persistence > 12 h)"
    economic_trigger: "same as A-D1 ; justified if the discount can widen or redemption can be suspended"
    bounds: "<= depth ; ahead of redemption queues"
    cost: "measured ladder slippage (10,000 stETH -> 7.13 bp in calm markets ; 755 bp on 2022-06-14)"
    expected_effect: "prevents a growing discount from being realized"
    applicability: "on-chain"
    precedent: "stETH May-June 2022 (30-day lead time, W3-A §3)"

  - action_id: "A-D3"
    persona: "DAO"
    name: "Repay a debt / de-lever"
    epistemic_trigger: "rising probability of freeze/liquidation at the debt venue (isFrozen, LTV->0, utilization ~ 100%)"
    economic_trigger: "repayment cost < expected loss under freeze (blocked exit)"
    bounds: "x <= available + debt ; repay debt first if collateral is locked"
    cost: "fees + gas"
    expected_effect: "reduces the liquidation surface ; frees collateral if LTV is imposed"
    applicability: "on-chain"
    precedent: "rsETH 18-20/04/2026 : WETH frozen, LTV -> 0 (MEASURED)"

  - action_id: "A-D4"
    persona: "DAO"
    name: "Withdraw liquidity / do not add any"
    epistemic_trigger: "freeze or saturation signal (cap_ratio >= 95%, isFrozen, cash utilization >= 99%, redemption queues)"
    economic_trigger: "withdrawal cost (gas) < option value of the exit ; if the exit is already closed -> ESCALATE"
    bounds: "<= available cash ; prioritize the most closed baskets"
    cost: "gas + any exit costs"
    expected_effect: "converts 'locked value' into 'available value' (redeemability)"
    applicability: "on-chain"
    precedent: "KPK/ENS exits Aave positions on 2026-04-18, rebuilt without loss"

  - action_id: "A-D5"
    persona: "DAO"
    name: "Repatriate to the runway module"
    epistemic_trigger: "operating buffer below target, or projected runway close to the floor"
    economic_trigger: "liquidity vs declared opportunity cost arbitrage"
    bounds: "<= module target ; standardized tranches (e.g. 1,500/3,000 ETH)"
    cost: "gas + opportunity cost"
    expected_effect: "maintains the hard constraint (runway) ; supports accountability"
    applicability: "on-chain"
    precedent: "ENS Registrar Manager + Zodiac module (~6 months of USDC)"

  - action_id: "A-D6"
    persona: "DAO"
    name: "Freeze / reduce spending"
    epistemic_trigger: "prolonged stress, loss of USD value, governance decision"
    economic_trigger: "n/a (policy decision)"
    bounds: "governance matter — not an agent action"
    cost: "—"
    expected_effect: "protects the treasury ; long cadence"
    applicability: "escalate (not an agent action)"
    precedent: "Lido : EGG utilization 22% then cuts ; Aave : buyback 50->30 M$"

  - action_id: "A-D7"
    persona: "DAO"
    name: "Do nothing (documented)"
    epistemic_trigger: "conclusive verdict with no action passing the threshold ; or H1 SUPPORTED + H2 REFUTED (local disturbance)"
    economic_trigger: "action cost >= conditional gain (SD2 friction <= 10%)"
    bounds: "x = 0"
    cost: "0 (opportunity cost if the alert repeats)"
    expected_effect: "avoids the systematic premium ; keeps the risk (on record)"
    applicability: "default (baseline state)"
    precedent: "W2-D §B.4.1 ; v0 engine rule 2"

  - action_id: "A-D8"
    persona: "DAO"
    name: "Escalate (committee / treasurer / governance)"
    epistemic_trigger: "A3/A4/A5 or integrity failure (B3 §c.4)"
    economic_trigger: "—"
    bounds: "—"
    cost: "human latency"
    expected_effect: "traceable and accountable decision ; no silent blocking"
    applicability: "escalate (not an agent action)"
    precedent: "W2-C (REQUIRE_APPROVAL flow) ; Chaos Labs"

# ---------------------------------------------------------------------------
# Desk catalogue — 4 actions.
# ---------------------------------------------------------------------------
persona_desk:
  - action_id: "K-D1"
    persona: "desk"
    name: "Reduce / exit an inventory position"
    epistemic_trigger: "break signal (D >= 200 bps, dispersion >= 300 bps)"
    economic_trigger: "x·(P_T - P_exec) > k_round_trip + funding ; costs money if the peg recovers (paid put : -4.2% on the USDC example)"
    bounds: "x <= min(x_max, Depth_eps) ; return plan included or declared"
    cost: "fees + slippage + funding"
    expected_effect: "reduces tail loss"
    applicability: "on-chain"
    precedent: "W2-D §E.3 ; DeFi Saver (stop-loss automation 0.25-0.30%)"

  - action_id: "K-D2"
    persona: "desk"
    name: "Hedge (short perp / depeg option)"
    epistemic_trigger: "residual exposure to an asset whose discount is possible"
    economic_trigger: "hedge cost < conditional loss"
    bounds: "notional <= exposure ; pre-funded margin ; venue on the allowlist"
    cost: "funding + option premium"
    expected_effect: "neutralizes the tail without selling spot"
    applicability: "simulated"
    precedent: "depegwatch 19/09/2025 ; Ethena (delta-neutral)"

  - action_id: "K-D3"
    persona: "desk"
    name: "Size (sizing)"
    epistemic_trigger: "always, before any action"
    economic_trigger: "publish realized slippage vs budget (ST2 <= 30 bp)"
    bounds: "x = min(x_max, Depth_eps, x*)"
    cost: "—"
    expected_effect: "prevents executing a 'loss avoided' smaller than its cost"
    applicability: "on-chain"
    precedent: "W2-D §A.2.5/T4"

  - action_id: "K-D4"
    persona: "desk"
    name: "Do nothing / wait"
    epistemic_trigger: "the threshold is not crossed ; symmetric uncertainty and prohibitive round-trip cost"
    economic_trigger: "cost decides the sign (churn)"
    bounds: "x = 0"
    cost: "0"
    expected_effect: "avoids churn (Miller/DSR — Bailey & López de Prado 2014)"
    applicability: "default (baseline state)"
    precedent: "W2-D §B.4"
